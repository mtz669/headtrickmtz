<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HEADTRICK</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    background:#050505;
    color:#fff;
    font-family:Arial,sans-serif;
}

.app{
    max-width:430px;
    min-height:100vh;
    margin:auto;
    background:#080808;
    padding-bottom:25px;
}

header{
    text-align:center;
    padding:25px 10px 18px;
    border-bottom:1px solid #252525;
}

.logo{
    color:#ff2020;
    font-size:32px;
    font-weight:900;
    letter-spacing:3px;
    text-shadow:0 0 12px #700;
}

.user{
    color:#777;
    font-size:13px;
    margin-top:6px;
}

.tabs{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:6px;
    padding:12px;
}

.tab{
    background:#111;
    color:#888;
    border:1px solid #292929;
    border-radius:8px;
    padding:11px 3px;
    font-size:11px;
    font-weight:bold;
}

.tab.active{
    background:#a90000;
    color:#fff;
    border-color:#ff2020;
}

.page{
    display:none;
    padding:5px 13px;
}

.page.active{
    display:block;
}

.box{
    background:#101010;
    border:1px solid #252525;
    border-radius:12px;
    padding:14px;
    margin-bottom:12px;
}

.title{
    color:#ff2525;
    font-size:16px;
    font-weight:bold;
    margin-bottom:12px;
}

.option{
    display:flex;
    justify-content:space-between;
    align-items:center;
    background:#151515;
    border:1px solid #222;
    border-radius:9px;
    padding:12px;
    margin:8px 0;
}

.name{
    font-size:14px;
}

.switch{
    width:45px;
    height:24px;
    position:relative;
}

.switch input{
    display:none;
}

.slider{
    position:absolute;
    inset:0;
    background:#292929;
    border-radius:20px;
}

.slider:before{
    content:"";
    position:absolute;
    width:18px;
    height:18px;
    left:3px;
    top:3px;
    background:#777;
    border-radius:50%;
    transition:.2s;
}

.switch input:checked + .slider{
    background:#9d0000;
}

.switch input:checked + .slider:before{
    transform:translateX(21px);
    background:#fff;
}

.inject{
    width:100%;
    border:0;
    border-radius:9px;
    padding:14px;
    background:#a90000;
    color:#fff;
    font-weight:bold;
    font-size:13px;
    margin-top:8px;
}

.inject:active{
    background:#d00000;
    transform:scale(.98);
}

.status{
    text-align:center;
    padding:12px;
    color:#777;
    background:#0d0d0d;
    border-radius:8px;
}

.status.ok{
    color:#25e66b;
}

.toast{
    position:fixed;
    left:50%;
    bottom:25px;
    transform:translate(-50%,100px);
    background:#151515;
    border:1px solid #e00000;
    border-radius:9px;
    padding:12px 18px;
    transition:.25s;
    z-index:99;
    white-space:nowrap;
}

.toast.show{
    transform:translate(-50%,0);
}
</style>
</head>

<body>

<div class="app">

<header>
    <div class="logo">HEADTRICK</div>
    <div class="user">@monteirox67</div>
</header>

<div class="tabs">
    <button class="tab active" onclick="page(0)">PRINCIPAL</button>
    <button class="tab" onclick="page(1)">BYPASS</button>
    <button class="tab" onclick="page(2)">AIMBOT</button>
    <button class="tab" onclick="page(3)">EXTRA</button>
</div>


<!-- PRINCIPAL -->

<section class="page active">

<div class="box">

<div class="title">🎯 PRINCIPAL</div>

<div class="option">
<span class="name">Cabeça</span>

<label class="switch">
<input type="checkbox">
<span class="slider"></span>
</label>
</div>

<div class="option">
<span class="name">Pescoço</span>

<label class="switch">
<input type="checkbox">
<span class="slider"></span>
</label>
</div>

<div class="option">
<span class="name">Peito</span>

<label class="switch">
<input type="checkbox">
<span class="slider"></span>
</label>
</div>

<div class="option">
<span class="name">Regular Aimbot</span>

<label class="switch">
<input type="checkbox">
<span class="slider"></span>
</label>
</div>

<button class="inject" onclick="ativar()">
INJETAR
</button>

</div>

</section>


<!-- BYPASS -->

<section class="page">

<div class="box">

<div class="title">🛡️ BYPASS</div>

<div class="option">
<span class="name">Códigos por IA</span>

<label class="switch">
<input type="checkbox">
<span class="slider"></span>
</label>
</div>

<div class="option">
<span class="name">Ativar Bypass</span>

<label class="switch">
<input type="checkbox">
<span class="slider"></span>
</label>
</div>

<button class="inject" onclick="ativar()">
INJETAR
</button>

</div>

</section>


<!-- AIMBOT -->

<section class="page">

<div class="box">

<div class="title">🎯 AIMBOT / MIRA</div>

<div class="option">
<span class="name">Aimbot Rage</span>

<label class="switch">
<input type="checkbox">
<span class="slider"></span>
</label>
</div>

<div class="option">
<span class="name">NoRecoil</span>

<label class="switch">
<input type="checkbox">
<span class="slider"></span>
</label>
</div>

<div class="option">
<span class="name">Tela Esticada</span>

<label class="switch">
<input type="checkbox">
<span class="slider"></span>
</label>
</div>

<div class="option">
<span class="name">Mira Pro</span>

<label class="switch">
<input type="checkbox">
<span class="slider"></span>
</label>
</div>

<button class="inject" onclick="ativar()">
INJETAR
</button>

</div>

</section>


<!-- EXTRA -->

<section class="page">

<div class="box">

<div class="title">⚙️ EXTRA</div>

<div class="option">
<span class="name">Modo Rápido</span>

<label class="switch">
<input type="checkbox">
<span class="slider"></span>
</label>
</div>

<div class="option">
<span class="name">Precisão</span>

<label class="switch">
<input type="checkbox">
<span class="slider"></span>
</label>
</div>

<button class="inject" onclick="ativar()">
INJETAR
</button>

</div>


<div class="box">

<div class="title">STATUS</div>

<div id="status" class="status">
Aguardando...
</div>

</div>

</section>

</div>


<div id="toast" class="toast"></div>


<script>

function page(numero){

    document.querySelectorAll(".page").forEach((p,i)=>{
        p.classList.toggle("active",i === numero);
    });

    document.querySelectorAll(".tab").forEach((t,i)=>{
        t.classList.toggle("active",i === numero);
    });
}


function toast(mensagem){

    const t = document.getElementById("toast");

    t.textContent = mensagem;

    t.classList.add("show");

    setTimeout(()=>{
        t.classList.remove("show");
    },2200);
}


function ativar(){

    const status = document.getElementById("status");

    if(status){

        status.textContent =
        "ABRINDO FREE FIRE MAX...";

        status.classList.add("ok");
    }

    localStorage.setItem(
        "HEADTRICK_ATIVO",
        "CONFIGURAÇÃO ATIVADA"
    );

    toast(
        "HEADTRICK — abrindo Free Fire MAX"
    );

    setTimeout(()=>{

        /*
        Tenta abrir diretamente o
        Free Fire MAX instalado.

        Não abre a Play Store como fallback.
        */

        window.location.href =
        "intent://#Intent;package=com.dts.freefiremax;end";

    },500);
}

</script>

</body>
  </html>
